name: Android release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install Android SDK
        run: |
          sdk="$HOME/android-sdk"
          mkdir -p "$sdk/cmdline-tools"
          curl -fsSL -o /tmp/cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-16111833_latest.zip
          unzip -q /tmp/cmdtools.zip -d "$sdk/cmdline-tools"
          mv "$sdk/cmdline-tools/cmdline-tools" "$sdk/cmdline-tools/latest"
          yes | "$sdk/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$sdk" --licenses >/dev/null
          "$sdk/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$sdk" --install "platform-tools" "platforms;android-36" "build-tools;35.0.0" "build-tools;36.0.0"
          echo "ANDROID_HOME=$sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk" >> "$GITHUB_ENV"

      - name: Install npm dependencies
        run: npm ci

      - name: Build the web app into the Android project
        run: npm run build:android

      - name: Assemble the signed release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          name: CyberCam ${{ github.ref_name }}
          fail_on_unmatched_files: true
          files: android/app/build/outputs/apk/release/app-release.apk
          body: |
            CyberCam ${{ github.ref_name }} 的签名 release APK。

            安装包 ID 是 `app.cybercam.android`。切到别的应用再回来，取景会继续动。ISO、快门和光圈收在取景框底部的一行里。取景画面也显示机身、胶卷、曝光补偿和当前摄像头。顶部按钮让开手机状态栏。竖屏时取景框是竖幅。成片长边最多 4096，按较高的 JPEG 质量保存。多颗后置镜头可以分别打开。横屏和竖屏是同一套界面，只有设置项的文字跟着手机方向转。回看成片时照片按原比例完整显示。胶卷颜色按扫描负片收过：肤色暖但不发灰，天空留得住蓝，高光慢慢收住。没有摄像头时可以导入一张照片。下载 RAW 和成片会打开系统分享，把文件存到相册或文件管理器。
